name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [swaddo-customer-app, swaddo-merchant-app, swaddo-delivery-app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./${{ matrix.app }}
        run: npm ci

      - name: Build Next.js App
        working-directory: ./${{ matrix.app }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./${{ matrix.app }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || npx cap sync android

      - name: Build Debug APK
        working-directory: ./${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: ./${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: ./${{ matrix.app }}/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apks
          path: |
            ${{ matrix.app }}/android/app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-aab
          path: |
            ${{ matrix.app }}/android/app/build/outputs/bundle/**/*.aab
